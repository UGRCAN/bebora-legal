<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bebora</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f0ff;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      border: 1px solid #eee;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    a.link {
      display: inline-block;
      background: #a855f7;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#x1F476;</div>
    <h1>Bebora</h1>
    <p>Bebeğinizin gelişimini takip eden, hesap gerektirmeyen ve tüm verilerinizi yalnızca cihazınızda tutan ücretsiz bebek takip uygulaması.</p>
    <a class="link" href="/privacy.html">Gizlilik Politikası / Privacy Policy</a>
  </div>
</body>
</html>
